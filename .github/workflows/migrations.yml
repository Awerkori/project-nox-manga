name: Deploy Yugabyte YSQL Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'yugabyte/migrations/**'
      - 'scripts/migrate-yugabyte.mjs'
      - '.github/workflows/migrations.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      YUGABYTE_HOST: ${{ secrets.YUGABYTE_HOST }}
      YUGABYTE_PORT: ${{ secrets.YUGABYTE_PORT }}
      YUGABYTE_USER: ${{ secrets.YUGABYTE_USER }}
      YUGABYTE_PASSWORD: ${{ secrets.YUGABYTE_PASSWORD }}
      YUGABYTE_DATABASE: ${{ secrets.YUGABYTE_DATABASE }}
      YUGABYTE_SSL_CA: ${{ secrets.YUGABYTE_SSL_CA }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply pending YSQL migrations
        run: npm run db:migrate -- --all
