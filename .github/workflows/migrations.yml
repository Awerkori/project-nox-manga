name: Deploy Yugabyte YSQL Migrations

on:
  # YSQL credentials are intentionally not uploaded to GitHub implicitly.
  # Run this only after a maintainer has configured the least-privilege YSQL
  # connection URL and CA through the approved GitHub administration path.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY_YSQL to apply pending migrations"
        required: true
        type: string

jobs:
  deploy:
    if: inputs.confirm == 'APPLY_YSQL'
    runs-on: ubuntu-latest
    env:
      YUGABYTE_URL: ${{ secrets.YUGABYTE_URL }}
      YUGABYTE_SSL_CA: ${{ secrets.YUGABYTE_SSL_CA }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate YSQL connection and migration prerequisites
        run: npm run db:migrate:dry-run

      - name: Apply pending YSQL migrations
        run: npm run db:migrate -- --all
