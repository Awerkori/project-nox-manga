name: Deploy Yugabyte YSQL Migrations

on:
  # YSQL credentials are intentionally not uploaded to GitHub implicitly.
  # Run this only after a maintainer has configured the least-privilege YSQL
  # connection URL and CA through the approved GitHub administration path.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run a read-only preflight or apply pending migrations'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      runner:
        description: 'Where to run the migration workflow'
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - ysql-migrations
      confirm:
        description: 'Required only for apply: type APPLY_YSQL'
        required: true
        type: string

jobs:
  deploy:
    if: inputs.mode == 'dry-run' || inputs.confirm == 'APPLY_YSQL'
    # The dedicated self-hosted label is only used by a one-job ephemeral
    # runner on an already allowlisted operator host. It avoids widening the
    # cluster network policy for GitHub's rotating hosted-runner IP ranges.
    runs-on: ${{ inputs.runner == 'ysql-migrations' && 'ysql-migrations' || 'ubuntu-latest' }}
    env:
      YUGABYTE_URL: ${{ secrets.YUGABYTE_URL }}
      YUGABYTE_SSL_CA: ${{ secrets.YUGABYTE_SSL_CA }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate YSQL connection and migration prerequisites
        run: npm run db:migrate:dry-run

      - name: Apply pending YSQL migrations
        if: inputs.mode == 'apply'
        run: npm run db:migrate -- --all
