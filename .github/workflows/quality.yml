name: Quality and security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: node scripts/test-database.mjs
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: node scripts/scan-secrets.mjs
      - run: git diff --check
